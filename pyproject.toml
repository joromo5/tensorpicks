[project]
name = "tensorpicks"
version = "0.1.0"
description = "Multi-agent business automation system powered by local LLMs"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.4",
    "slack-sdk>=3.33",
    "httpx>=0.28",
    "apscheduler>=3.10",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tweepy>=4.14",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.3",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
tensorpicks = "tensorpicks.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
